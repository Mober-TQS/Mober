services:
  broker:
    image: eclipse-mosquitto:2.0.22
    container_name: mober-mqtt-broker
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    ports:
      - "1883:1883"

  simulator:
    build:
      context: ./simulator
    container_name: mober-telemetry-simulator
    environment:
      SIMULATOR_MQTT_HOST: broker
      SIMULATOR_MQTT_PORT: 1883
      SIMULATOR_SCENARIO_FILE: classpath:scenarios/mober.yml
    depends_on:
      - broker
    restart: unless-stopped
