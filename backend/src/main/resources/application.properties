spring.application.name=Mober Backend

# Database configuration (H2 for fast local execution and tests)
spring.datasource.url=jdbc:h2:mem:moberdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
mober.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
mober.jwt.expiration-ms=86400000
