# Template for scenario: copy this file, change it, and mount it into the container
# (see docker-compose.yml next to this file). Every field is described in the README, section
# "Scenario file". If a value breaks a rule, the simulator does not start and logs every problem.
fleetId: mober-fleet-01

simulation:
  emissionIntervalSeconds: 10   # seconds between two readings of a vehicle, greater than 0
  seed: 42                      # whole number; reproducible runs
  faultProbability: 0           # chance of a random fault per reading, 0 to 1
  drainPercentPerMinute: 0.5    # optional: battery lost per minute while riding
  chargePercentPerMinute: 0.6   # optional: battery gained per minute parked at a hub
  tripProbability: 0.05         # optional: chance per reading that a parked vehicle starts a trip
  rideSpeedKmh: 18              # optional: speed during delivery trips

hubs:
  - id: hub-glicinias
    name: Centro Comercial Glicinias Plaza
    position: { lat: 40.6272, lon: -8.6471 }
  - id: hub-forum
    name: Forum Aveiro
    position: { lat: 40.6412, lon: -8.6501 }

vehicles:
  - { id: mober-bike-0001, type: E_BIKE, hub: hub-glicinias, battery: 95 }
  - { id: mober-bike-0002, type: E_BIKE, hub: hub-forum, battery: 18 }

# Optional: many vehicles without listing them. Creates vehicle-0001, vehicle-0002, ... spread
# over the hubs in turn. Listed vehicles come first.
generatedVehicles:
  count: 4
  idPrefix: vehicle

# Optional: faults at set moments, to test a maintenance flow with the same result every time.
faults:
  - { vehicle: mober-bike-0001, code: FLAT_TIRE, atSeconds: 30, clearAfterSeconds: 60 }
  - { vehicle: vehicle-0001, code: BATTERY_OVERHEAT, atSeconds: 60 }
